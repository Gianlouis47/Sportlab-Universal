services:
  sofascore:
    build:
      context: https://github.com/tunjayoff/sofascore_scraper.git#dd9f061be2c64f01a6d3a50fb34d55a102d7107b
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SOFASCORE_SERVER__ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
    shm_size: "1gb"
    volumes:
      - sofascore-data:/app/data
      - sofascore-config:/app/config
      - sofascore-browser:/app/browser-profile
      - sofascore-logs:/app/logs
volumes:
  sofascore-data:
  sofascore-config:
  sofascore-browser:
  sofascore-logs:
