[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sportlab-universal"
version = "0.1.0"
description = "Reusable sports modeling and Monte Carlo engine for SportLab Universal"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0","psycopg[binary]>=3.2","PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sportlab = "sportlab.cli:main"

[tool.setuptools.packages.find]
include = ["sportlab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
